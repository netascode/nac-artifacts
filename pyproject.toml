[project]
name = "nac-artifacts"
version = "0.1.0"
description = "A Python library to discover and layer the schema, rules and test artifacts packaged with Network-as-Code modules and bundles."
license = { text = "MPL-2.0" }
readme = "README.md"
authors = [
    { name = "Daniel Schmidt", email = "danischm@cisco.com" },
]
maintainers = [
    { name = "Daniel Schmidt", email = "danischm@cisco.com" },
]
requires-python = ">=3.10"
keywords = ["terraform", "opentofu", "artifacts", "nac", "network-as-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "ruamel.yaml>=0.19.1",
    "packaging>=24",
]

[project.urls]
homepage = "https://github.com/netascode/nac-artifacts"
repository = "https://github.com/netascode/nac-artifacts"
documentation = "https://github.com/netascode/nac-artifacts"

[project.optional-dependencies]
dev = [
    "bandit[toml]>=1.9.1",
    "pre-commit>=4.4.0",
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.14.5",
    "ty>=0.0.78",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nac_artifacts"]

[tool.coverage.run]
source = ["nac_artifacts"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "@abstract", "except ImportError:"]

[tool.pytest.ini_options]
markers = ["unit", "integration"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.rules]
"all" = "error"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["nac_artifacts"]

[tool.bandit]
exclude_dirs = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
